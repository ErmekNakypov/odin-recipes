<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <aside class="sidebar">
            <div class="logo-container">
                <img class="logo" src="assets/odin-lined.png" alt="odin-logo">
                <p class="logo-text">ODIN</p>
            </div>
            <div class="credit">
                <p>
                    Photo by <u>Halie West</u> on <u>Unsplash</u>
                </p>
            </div>
        </aside>
        <main class="main">
            <section class="form-header">
                <p>
                    This is not a real online service! You know you need something <br> like
                    this in your life to help you realize your deepest dreams. <br>
                    Sign up now to get started.
                </p>
                <p>You <i>know</i> you want to.</p>
            </section>
            <section class="form">
                <p>
                    Let's do this!
                </p>
                <form id="myForm" class="form-container">
                    <fieldset class="input-form">
                        <div>
                            <label for="first-name">FIRST NAME</label>
                            <input type="text" id="first-name" required>
                        </div>
                        <div>
                            <label for="email">EMAIL</label>
                            <input type="email" id="email" required>
                        </div>
                        <div>
                            <label for="password">PASSWORD</label>
                            <input type="password" id="password" required>
                        </div>
                    </fieldset>
                    <fieldset class="input-form">
                        <div>
                            <label for="last-name">LAST NAME</label>
                            <input type="text" id="last-name" required>
                        </div>
                        <div>
                            <label for="phone">PHONE NUMBER</label>
                            <input type="text" id="phone" required>
                        </div>
                        <div>
                            <label for="confirm_password">CONFIRM PASSWORD</label>
                            <input type="password" id="confirm_password" required>
                        </div>
                    </fieldset>
                </form>
            </section>
            <section class="form-footer">
                <button class="submit-button" type="submit" form="myForm">Create Account</button>
                <p>Already have an account? <a href="">Log in</a></p>
            </section>
        </main>
    </div>
</body>

</html>
